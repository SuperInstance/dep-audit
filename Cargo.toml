[package]
name = "dep-audit"
version = "0.1.0"
edition = "2021"
description = "CLI tool to audit Rust crate dependencies: vulnerabilities, outdated deps, tree depth, unused deps, and health score"
license = "MIT"
repository = "https://github.com/SuperInstance/dep-audit"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
colored = "2"
cargo_metadata = "0.19"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
predicates = "3"
